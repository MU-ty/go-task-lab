name: Go checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -cover ./...
      - run: go build ./...
      - run: node scripts/check-courses.cjs
      - name: Verify generated backend examples stay in sync
        run: |
          node scripts/generate-backend.cjs
          gofmt -w internal/backendlesson
          git diff --exit-code -- internal/backendlesson internal/web/static/backend-courses.js
